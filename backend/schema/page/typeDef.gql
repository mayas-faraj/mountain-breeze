type Query {
  getPageBySlug(slug: String): Page
}

type Page {
  title: String
  feature_img_src: String
  feature_img_alt: String
  og_image: String
  section: [Section]
}

type Section {
  name: String
  display_order: Int
  content: String
  button_link: String
  button_text: String
  section_image: [Image]
}

type Image {
  img_src: String
  img_alt: String
  title: String
}

